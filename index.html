/* Ícono de pestaña, barra de tareas y ventana de la app: PNG nítidos (16, 32, 48 y 256 px) que cambian solos con el modo claro u oscuro del navegador. */
(function(){var mq=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");
function poner(){var m=mq&&mq.matches?"oscuro":"claro";var v=document.querySelectorAll("link[data-fav]");for(var i=0;i<v.length;i++)v[i].parentNode.removeChild(v[i]);
[16,32,48,256].forEach(function(s){var l=document.createElement("link");l.rel="icon";l.type="image/png";l.sizes=s+"x"+s;l.href="assets/propentia/icons/"+m+"-"+s+".png";l.setAttribute("data-fav","1");document.head.appendChild(l)})}
poner();if(mq){if(mq.addEventListener)mq.addEventListener("change",poner);else if(mq.addListener)mq.addListener(poner)}})();
</script>
